std = "bemtvi"
exclude = [".panvimdoc/**"]

[lints]
# `"\u{XXXX}"` is a valid 5.3+ escape, but the lua51 base std doesn't know it.
bad_string_escape = "allow"
# Mixed tables are idiomatic in btv specs (`{ "owner/repo", config = fn }`).
mixed_table = "allow"
# stylua.toml sets `collapse_simple_statement = "Always"`, which folds short
# `if x then y end` blocks onto one line on purpose. selene would flag every one.
multiple_statements = "allow"
