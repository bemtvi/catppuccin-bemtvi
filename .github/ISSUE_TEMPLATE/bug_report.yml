name: Bug report
description: Report a problem with catppuccin-bemtvi
labels: [bug]
body:
  - type: textarea
    attributes:
      label: "Description"
      description: "A short description of the problem you are reporting."
    validations:
      required: true
  - type: input
    attributes:
      label: "bemtvi version"
      description: "Output of `bemtvi --version`, plus the commit if you build from source."
      placeholder: "bemtvi 0.1.0"
    validations:
      required: true
  - type: input
    attributes:
      label: "Client and terminal"
      description: "The bemtvi client (TUI, GUI, web) and, for the TUI, the terminal and multiplexer."
      placeholder: "TUI in kitty 0.29.2 with tmux 3.3a"
    validations:
      required: true
  - type: input
    attributes:
      label: "catppuccin-bemtvi version / rev"
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Steps to reproduce"
      description: "Steps to reproduce using the minimal config below."
      placeholder: |
        1. `BEMTVI_CONFIG=/tmp/repro bemtvi`
        2. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Actual behavior"
      description: "Observed behavior (may optionally include logs, images, or videos)."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Repro
      description: Minimal `init.lua` that shows the issue. Save it as `/tmp/repro/init.lua` and run `BEMTVI_CONFIG=/tmp/repro bemtvi`, so your own config stays out of it.
      value: |
        btv.plugins({
          {
            "bemtvi/catppuccin-bemtvi",
            config = function()
              require("catppuccin").setup({})
              btv.cmd("colorscheme catppuccin-mocha")
            end,
          },
        })
        -- add anything else here
      render: Lua
